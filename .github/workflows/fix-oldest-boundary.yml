name: Fix oldest channel history boundary

on:
  push:
    branches:
      - chatgpt/post-disk-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run oldest boundary fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/fix-oldest-boundary.py

      - name: Validate and commit
        shell: bash
        run: |
          rm .github/fix-oldest-boundary.py
          rm .github/workflows/fix-oldest-boundary.yml
          git diff --check
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add sources/chat-area/ChannelPostSource.cpp \
                  sources/chat-area/ChannelPostSource.h \
                  docs/long-list-architecture.md \
                  docs/post-cache.md \
                  .github/fix-oldest-boundary.py \
                  .github/workflows/fix-oldest-boundary.yml
          git commit -m 'Resolve overestimated channel history boundary'
          git push origin HEAD:chatgpt/post-disk-cache
