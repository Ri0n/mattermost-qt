name: Apply Personal navigation fix

on:
  push:
    branches:
      - chatgpt/sidebar-personal
    paths:
      - .github/fix_personal_navigation.py
      - .github/workflows/fix-personal-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sidebar-personal
          fetch-depth: 0
      - run: python3 .github/fix_personal_navigation.py
      - run: rm .github/fix_personal_navigation.py .github/workflows/fix-personal-navigation.yml
      - run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Resolve programmatic self-DM navigation through Personal"
          git push origin HEAD:chatgpt/sidebar-personal
