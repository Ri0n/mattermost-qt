name: Link post cache and source architecture docs

on:
  push:
    paths:
      - '.github/workflows/link-post-cache-source-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Update docs
        run: python3 .github/scripts/link-post-cache-source-docs.py
      - name: Remove temporary helper
        run: rm .github/scripts/link-post-cache-source-docs.py .github/workflows/link-post-cache-source-docs.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Document cache and source ownership boundaries'
          git push origin HEAD:chatgpt/post-disk-cache
