name: Fix collection transport compatibility

on:
  push:
    branches:
      - chatgpt/saved-search-collections
    paths:
      - .github/workflows/fix-collection-transport.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
          fetch-depth: 0
      - name: Patch collection transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sources/backend/PostRepository.cpp')
          s = p.read_text()
          old = '#include "PostRepository.h"\n'
          new = '#include "PostRepository.h"\n\n#include "QByteArrayCreator.h"\n'
          if old not in s:
              raise SystemExit('PostRepository include anchor missing')
          s = s.replace(old, new, 1)
          old = 'result.hasMore = perPage > 0 && order.size() >= perPage;'
          new = ('const int returnedCount = order.isEmpty()\n'
                 '        ? static_cast<int>(result.posts.size()) : order.size();\n'
                 '    result.hasMore = perPage > 0 && returnedCount >= perPage;')
          if old not in s:
              raise SystemExit('collection hasMore anchor missing')
          s = s.replace(old, new, 1)
          old = 'httpConnector.post(request, body, HttpResponseCallback('
          new = 'httpConnector.post(request, QByteArrayCreator(body), HttpResponseCallback('
          if old not in s:
              raise SystemExit('search POST anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-collection-transport.yml
      - name: Commit
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Fix collection transport compatibility"
          git push origin HEAD:chatgpt/saved-search-collections
