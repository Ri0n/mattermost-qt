name: Finalize interactive search

on:
  push:
    branches:
      - chatgpt/saved-search-collections

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
      - name: Apply focused source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('sources/backend/PostRepository.cpp')
          text = repo.read_text()
          pattern = re.compile(
              r'(?m)^\s*const int returnedCount = order\.isEmpty\(\)\n'
              r'\s*\? static_cast<int>\(result\.posts\.size\(\)\) : order\.size\(\);\n'
              r'\s*result\.hasMore = perPage > 0 && returnedCount >= perPage;\n'
              r'\s*result\.success = true;')
          replacement = '''    const int returnedCount = order.isEmpty()
              ? static_cast<int>(result.posts.size()) : order.size();
          result.completeResultSet = perPage > 0 && returnedCount > perPage;
          result.hasMore = !result.completeResultSet
              && perPage > 0 && returnedCount >= perPage;
          result.success = true;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'PostRepository collection regex count: {count}')
          repo.write_text(text)

          cmake = Path('tests/CMakeLists.txt')
          text = cmake.read_text()
          source = '    "${CMAKE_SOURCE_DIR}/sources/chat-area/outgoing-post/MessageTextEditWidget.cpp"\n'
          addition = source + '    "${CMAKE_SOURCE_DIR}/sources/widgets/InteractiveTextEdit.cpp"\n'
          if text.count(source) != 1:
              raise SystemExit(f'message text source line count: {text.count(source)}')
          cmake.write_text(text.replace(source, addition, 1))
          PY

          rm .github/workflows/finalize-interactive-search.yml
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Finalize lazy search paging infrastructure'
          git push origin HEAD:chatgpt/saved-search-collections
