name: Document rematerialization availability

on:
  push:
    paths:
      - '.github/workflows/document-rematerialization-availability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Update docs
        run: python3 .github/scripts/document-rematerialization-availability.py
      - name: Remove temporary helper
        run: rm .github/scripts/document-rematerialization-availability.py .github/workflows/document-rematerialization-availability.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Document resident rematerialization signaling'
          git push origin HEAD:chatgpt/post-disk-cache
