name: Refine resident post eviction

on:
  push:
    paths:
      - '.github/workflows/refine-resident-eviction.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply refinements
        run: python3 .github/scripts/refine-resident-eviction.py
      - name: Remove temporary files
        run: rm .github/scripts/refine-resident-eviction.py .github/workflows/refine-resident-eviction.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Test resident body rematerialization'
          git push origin HEAD:chatgpt/post-disk-cache
