name: Apply scrollbar materialization fix

on:
  push:
    paths:
      - '.github/workflows/apply-scrollbar-materialization-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix-scrollbar-materialization.py
      - name: Remove temporary files
        run: rm .github/scripts/fix-scrollbar-materialization.py .github/workflows/apply-scrollbar-materialization-fix.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Fix scrollbar materialization churn'
          git push origin HEAD:chatgpt/post-disk-cache
