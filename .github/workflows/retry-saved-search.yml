name: Retry Saved and search collections

on:
  push:
    branches:
      - chatgpt/saved-search-collections
    paths:
      - .github/workflows/retry-saved-search.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
          fetch-depth: 0
      - name: Stabilize UI helper anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/apply_saved_search.py')
          s = p.read_text()
          marker = '# UI: give username room to shrink and insert magnifier next to hamburger.'
          start = s.index(marker)
          first = s.index('replace_once("sources/mainwindow.ui",', start)
          second = s.index('replace_once("sources/mainwindow.ui",', first + 1)
          replacement = '''p_ui = Path("sources/mainwindow.ui")\nui_text = p_ui.read_text()\nui_text, changed = re.subn(\n    r'(<widget class="QLabel" name="usernameLabel">.*?<minimumSize>.*?<width>)\\s*200\\s*(</width>)',\n    r'\\g<1>0\\g<2>', ui_text, count=1, flags=re.S)\nif changed != 1:\n    raise SystemExit("usernameLabel minimum width anchor not found")\np_ui.write_text(ui_text)\n\n'''
          p.write_text(s[:first] + replacement + s[second:])
          PY
      - name: Apply implementation
        run: python3 .github/apply_saved_search.py
      - name: Remove temporary helpers
        run: rm .github/apply_saved_search.py .github/workflows/apply-saved-search.yml .github/workflows/retry-saved-search.yml
      - name: Commit
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Add Saved and message search collections"
          git push origin HEAD:chatgpt/saved-search-collections
