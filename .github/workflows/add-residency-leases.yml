name: Add post residency leases

on:
  push:
    paths:
      - '.github/workflows/add-residency-leases.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply lease integration
        run: python3 .github/scripts/add-residency-leases.py
      - name: Remove temporary helper
        run: rm .github/scripts/add-residency-leases.py .github/workflows/add-residency-leases.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Add explicit resident post leases'
          git push origin HEAD:chatgpt/post-disk-cache
