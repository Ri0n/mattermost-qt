name: Add post residency leases

on:
  push:
    paths:
      - '.github/workflows/add-residency-leases.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply lease integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/add-residency-leases.py')
          text = path.read_text()
          marker = '# Document what is protected now and what still blocks actual eviction.'
          if marker not in text:
              raise SystemExit('lease helper docs marker missing')
          path.write_text(text.split(marker, 1)[0] + "print('resident raw-reference leases integrated')\n")
          PY
          python3 .github/scripts/add-residency-leases.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/post-cache-runtime.md')
          text = path.read_text()
          marker = 'Before erasing resident `BackendPost` objects, raw-pointer lifetimes must be audited. In particular,\n'
          if text.count(marker) != 1:
              raise SystemExit('runtime lease insertion marker mismatch')
          addition = (
              '`PostResidencyLease` implements the raw-reference lifetime contract as a move-only RAII pin in '
              '`PostRepository`. Every materialized `PostWidget` owns one for its full lifetime. The outgoing '
              'composer owns an independent edit-session lease because `postToEdit` may outlive the materialized '
              'row while an edit request is pending or retryable. Actual eviction may only consider posts with zero '
              'explicit leases. A root also remains implicitly non-evictable while a resident reply still points to '
              'it through the legacy `BackendPost::rootPost` relationship.\n\n'
          )
          path.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Remove temporary helper
        run: rm .github/scripts/add-residency-leases.py .github/workflows/add-residency-leases.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Add explicit resident post leases'
          git push origin HEAD:chatgpt/post-disk-cache
