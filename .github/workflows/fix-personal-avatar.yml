name: Apply Personal avatar parity fix

on:
  push:
    branches:
      - chatgpt/sidebar-personal
    paths:
      - .github/fix_personal_avatar.py
      - .github/workflows/fix-personal-avatar.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sidebar-personal
          fetch-depth: 0
      - run: python3 .github/fix_personal_avatar.py
      - run: rm .github/fix_personal_avatar.py .github/workflows/fix-personal-avatar.yml
      - run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Match Personal avatar and presence to direct messages"
          git push origin HEAD:chatgpt/sidebar-personal
