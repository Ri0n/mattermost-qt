name: Restore local boundary formatting

on:
  push:
    branches:
      - chatgpt/post-disk-cache

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run restore boundary format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Restore focused formatting
        run: python3 restore-boundary-format.py
      - name: Validate and commit
        shell: bash
        run: |
          rm restore-boundary-format.py
          rm .github/workflows/restore-boundary-format.yml
          git diff --check
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add sources/chat-area/ChannelPostSource.cpp \
                  sources/chat-area/ChannelPostSource.h
          git add -u .github
          git add -u restore-boundary-format.py
          git commit -m 'Restore focused boundary formatting'
          git push origin HEAD:chatgpt/post-disk-cache
