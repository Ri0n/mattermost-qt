name: Restore local boundary formatting

on:
  push:
    branches:
      - chatgpt/post-disk-cache

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Restore local boundary formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Restore and fix only new block indentation
        shell: bash
        run: |
          git checkout 88b91979306f76e4b634a0d9dcd0aec2af682db7 -- \
              sources/chat-area/ChannelPostSource.cpp \
              sources/chat-area/ChannelPostSource.h
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sources/chat-area/ChannelPostSource.cpp')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '''        if (oldestBoundaryFullPageChecked == oldestBoundaryNonEmptyPage) {
            reconcileRootCount((oldestBoundaryNonEmptyPage + 1) * ServerPageSize);
            finishOldestBoundaryProbe();
        } else {
            loadOldestBoundaryPage(oldestBoundaryNonEmptyPage);
        }
'''.replace('            reconcile', '  reconcile').replace('            finish', '  finish').replace('            load', '  load'),
              '''        if (oldestBoundaryFullPageChecked == oldestBoundaryNonEmptyPage) {
            reconcileRootCount((oldestBoundaryNonEmptyPage + 1) * ServerPageSize);
            finishOldestBoundaryProbe();
        } else {
            loadOldestBoundaryPage(oldestBoundaryNonEmptyPage);
        }
''',
              'adjacent block')

          replace_once(
              '''        oldestBoundaryProbeStep = std::min(oldestBoundaryEmptyPage + 1,
                                 oldestBoundaryProbeStep * 2);
''',
              '''        oldestBoundaryProbeStep = std::min(oldestBoundaryEmptyPage + 1,
                                           oldestBoundaryProbeStep * 2);
''',
              'step continuation')

          replace_once(
              '''        page = oldestBoundaryNonEmptyPage
  + (oldestBoundaryEmptyPage - oldestBoundaryNonEmptyPage) / 2;
''',
              '''        page = oldestBoundaryNonEmptyPage
            + (oldestBoundaryEmptyPage - oldestBoundaryNonEmptyPage) / 2;
''',
              'binary continuation')

          def indent_lambda(marker):
              global text
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'lambda marker not found: {marker}')
              body_start = text.find('\n', start) + 1
              end = text.find('        });', body_start)
              if end < 0:
                  raise SystemExit(f'lambda end not found: {marker}')
              body = text[body_start:end]
              lines = body.splitlines(keepends=True)
              if not any(line.startswith('  ') for line in lines if line.strip()):
                  raise SystemExit(f'lambda already/unexpectedly indented: {marker}')
              body = ''.join(('          ' + line if line.strip() else line) for line in lines)
              text = text[:body_start] + body + text[end:]

          indent_lambda('        [guard, page, offset](const PostTimelineService::Page& result) {')
          indent_lambda('        [guard, page](const PostTimelineService::Page& result) {')

          path.write_text(text)
          PY
          rm .github/workflows/restore-boundary-format.yml
          git diff --check
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add sources/chat-area/ChannelPostSource.cpp sources/chat-area/ChannelPostSource.h
          git add -u .github
          git commit -m 'Restore focused boundary formatting'
          git push origin HEAD:chatgpt/post-disk-cache
