name: Normalize cache cursor fix

on:
  push:
    branches:
      - chatgpt/post-disk-cache
    paths:
      - .github/workflows/chatgpt-fix-cache-warnings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Normalize Qt5/Qt6 size conversions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sources/chat-area/ChannelPostSource.cpp')
          s = p.read_text()
          replacements = {
              'while (rightAnchor < postIds.size()': 'while (rightAnchor < static_cast<int>(postIds.size())',
              'if (rightAnchor >= postIds.size())': 'if (rightAnchor >= static_cast<int>(postIds.size()))',
              'const int removeCount = guard->postIds.size()\n                                    - expectedLast - 1;': 'const int removeCount = static_cast<int>(guard->postIds.size())\n                                    - expectedLast - 1;',
              'const int phantomPrefix = guard->postIds.size() - actualCount;': 'const int phantomPrefix = static_cast<int>(guard->postIds.size()) - actualCount;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/chat-area/ChannelPostSource.cpp
          git commit -m "Keep channel cursor code warning-clean"
          git push origin HEAD:chatgpt/post-disk-cache
