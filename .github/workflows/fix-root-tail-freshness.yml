name: Fix root-tail freshness

on:
  push:
    paths:
      - '.github/workflows/fix-root-tail-freshness.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/fix-root-tail-freshness.py
      - name: Remove temporary helper
        run: rm .github/scripts/fix-root-tail-freshness.py .github/workflows/fix-root-tail-freshness.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Use root timeline freshness for cached tails'
          git push origin HEAD:chatgpt/post-disk-cache

# Retry after making the helper independent of legacy tab alignment.
