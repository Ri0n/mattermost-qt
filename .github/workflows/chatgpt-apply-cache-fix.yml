name: Apply cache timeline regression fix

on:
  push:
    branches:
      - chatgpt/post-disk-cache
    paths:
      - .github/workflows/chatgpt-apply-cache-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('sources/chat-area/ChannelPostSource.cpp')
          source = source_path.read_text()
          pattern = re.compile(
              r'void ChannelPostSource::requestRange\(int first,.*?\n\}\n\nbool ChannelPostSource::canRequestBeforeFirst\(\) const',
              re.S,
          )
          replacement = r'''void ChannelPostSource::requestRange(int first,
                                               int last,
                                               RequestReason reason,
                                               quint64 generation)
          {
              Q_UNUSED(reason)
              Q_UNUSED(generation)

              if (!exactRootCount || postIds.isEmpty()) {
                  emit rangeRequestFinished(first, last);
                  return;
              }

              const int requestedFirst = std::max(0, first);
              const int requestedLast = std::min(static_cast<int>(postIds.size()) - 1, last);
              if (requestedLast < requestedFirst) {
                  emit rangeRequestFinished(first, last);
                  return;
              }

              // A semantic navigation island has exact local adjacency but only an
              // estimated global offset. Continue resolving it exclusively by identity.
              if (requestTouchesProvisionalWindow(requestedFirst, requestedLast)) {
                  requestProvisionalRange(first, last);
                  return;
              }

              int firstMissing = requestedFirst;
              while (firstMissing <= requestedLast && isAvailable(firstMissing)) {
                  ++firstMissing;
              }
              if (firstMissing > requestedLast) {
                  emit rangeRequestFinished(first, last);
                  return;
              }

              int lastMissing = requestedLast;
              while (lastMissing > firstMissing && isAvailable(lastMissing)) {
                  --lastMissing;
              }

              int leftAnchor = firstMissing - 1;
              while (leftAnchor >= 0
                     && !isAuthoritativePost(postIds.at(leftAnchor))) {
                  --leftAnchor;
              }

              int rightAnchor = lastMissing + 1;
              while (rightAnchor < postIds.size()
                     && !isAuthoritativePost(postIds.at(rightAnchor))) {
                  ++rightAnchor;
              }
              if (rightAnchor >= postIds.size()) {
                  rightAnchor = -1;
              }

              QPointer<ChannelPostSource> guard(this);
              auto finish = [guard, first, last] {
                  if (guard) {
                      emit guard->rangeRequestFinished(first, last);
                  }
              };

              // Sequential scrolling is cursor-authoritative. Once one side of a
              // missing interval has a concrete identity, page-number arithmetic is no
              // longer allowed to move that identity or infer its adjacency.
              if (leftAnchor >= 0 || rightAnchor >= 0) {
                  const bool useLeft = leftAnchor >= 0
                      && (rightAnchor < 0
                          || firstMissing - leftAnchor <= rightAnchor - lastMissing);

                  if (useLeft) {
                      const QString anchorId = postIds.at(leftAnchor);
                      PostTimelineService::instance(backend).loadChannelAfter(
                          channel, anchorId, ServerPageSize,
                          [guard, anchorId, finish](const PostTimelineService::Page& result) {
                              if (!guard) {
                                  return;
                              }

                              if (result.success) {
                                  int anchorIndex = guard->indexOfPost(anchorId);
                                  if (anchorIndex >= 0) {
                                      const bool reachedNewest = result.nextPostId.isEmpty()
                                          || static_cast<int>(result.postIds.size()) < ServerPageSize;

                                      // If an identity cursor proves the newest boundary,
                                      // every logical slot after the returned adjacency is
                                      // a stale total_msg_count_root estimate. Remove it
                                      // structurally instead of letting a later page shift
                                      // already authoritative identities.
                                      if (reachedNewest) {
                                          const int expectedLast = anchorIndex
                                              + static_cast<int>(result.postIds.size());
                                          const int removeCount = guard->postIds.size()
                                              - expectedLast - 1;
                                          if (removeCount > 0) {
                                              guard->rootCountOverestimate += removeCount;
                                              guard->removeLogicalRange(expectedLast + 1,
                                                                        removeCount);
                                          }
                                      }

                                      QStringList context;
                                      context.reserve(result.postIds.size() + 1);
                                      context.push_back(anchorId);
                                      context.append(result.postIds);
                                      if (!result.postIds.isEmpty() || reachedNewest) {
                                          guard->placeNavigationContext(anchorId, context,
                                                                        false, reachedNewest);
                                      }
                                  }
                              }
                              finish();
                          });
                      return;
                  }

                  const QString anchorId = postIds.at(rightAnchor);
                  PostTimelineService::instance(backend).loadChannelBefore(
                      channel, anchorId, ServerPageSize,
                      [guard, anchorId, finish](const PostTimelineService::Page& result) {
                          if (!guard) {
                              return;
                          }

                          if (result.success) {
                              int anchorIndex = guard->indexOfPost(anchorId);
                              if (anchorIndex >= 0) {
                                  const bool reachedOldest = result.prevPostId.isEmpty()
                                      || static_cast<int>(result.postIds.size()) < ServerPageSize;

                                  // A proven oldest boundary also tells us exactly
                                  // how much total_msg_count_root overestimated the
                                  // logical prefix. Removing that prefix shifts all
                                  // newer authoritative identities together.
                                  if (reachedOldest) {
                                      const int phantomPrefix = anchorIndex
                                          - static_cast<int>(result.postIds.size());
                                      if (phantomPrefix > 0) {
                                          guard->rootCountOverestimate += phantomPrefix;
                                          guard->removeLogicalRange(0, phantomPrefix);
                                      }
                                  }

                                  QStringList context = result.postIds;
                                  context.push_back(anchorId);
                                  if (!result.postIds.isEmpty() || reachedOldest) {
                                      guard->placeNavigationContext(anchorId, context,
                                                                    reachedOldest, false);
                                  }
                              }
                          }
                          finish();
                      });
                  return;
              }

              // No identity is close enough to the requested block. An absolute
              // page is only a seed for a provisional island; it must never become
              // authoritative merely because total_msg_count_root supplied an
              // approximate global coordinate.
              const int seedIndex = (firstMissing + lastMissing) / 2;
              const int page = pageForIndex(seedIndex);
              PostTimelineService::instance(backend).loadChannelPage(
                  channel, page, ServerPageSize,
                  [guard, page, finish](const PostTimelineService::Page& result) {
                      if (!guard) {
                          return;
                      }

                      if (result.success && !result.postIds.isEmpty()) {
                          const bool reachedOldest = result.prevPostId.isEmpty()
                              || static_cast<int>(result.postIds.size()) < ServerPageSize;
                          const bool reachedNewest = page == 0;

                          if (reachedOldest && page > 0) {
                              const int actualCount = page * ServerPageSize
                                  + static_cast<int>(result.postIds.size());
                              const int phantomPrefix = guard->postIds.size() - actualCount;
                              if (phantomPrefix > 0) {
                                  guard->rootCountOverestimate += phantomPrefix;
                                  guard->removeLogicalRange(0, phantomPrefix);
                              }
                          }

                          const QString targetId = result.postIds.at(result.postIds.size() / 2);
                          guard->placeNavigationContext(targetId, result.postIds,
                                                        reachedOldest, reachedNewest);
                      }
                      finish();
                  });
          }

          bool ChannelPostSource::canRequestBeforeFirst() const'''

          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('failed to replace ChannelPostSource::requestRange')
          source_path.write_text(source)

          backend_path = Path('sources/backend/Backend.cpp')
          backend = backend_path.read_text()
          old_resync = '''\t\t\tfor (auto& it: storage.channels) {
          \t\t\t\tretrieveChannelPosts (*it, 0, 25);
          \t\t\t}

          \t\t\tfor (auto& it: storage.channels) {
          \t\t\t\tretrieveChannelPinnedPosts (*it);
          \t\t\t}
          '''
          new_resync = '''\t\t\t// Reliable WebSocket replay already covers normal reconnects. If
          \t\t\t// replay explicitly failed, validate only the conversation the user
          \t\t\t// is looking at. Bulk-resyncing every joined channel turns one broken
          \t\t\t// socket into hundreds of history and pinned-post requests.
          \t\t\tif (currentChannel) {
          \t\t\t\tretrieveChannelPosts (*currentChannel, 0, 25);
          \t\t\t}
          '''
          if old_resync not in backend:
              raise SystemExit('failed to find Backend reconnect resync loops')
          backend = backend.replace(old_resync, new_resync, 1)

          if '#include "RealtimeFallbackService.h"' not in backend:
              backend = backend.replace('#include "NetworkRequest.h"\n',
                                        '#include "NetworkRequest.h"\n#include "RealtimeFallbackService.h"\n', 1)
          fallback_marker = ('\tattachmentsCache.setMaximumCacheSize (300 * 1024 * 1024);\n')
          if 'RealtimeFallbackService::instance(*this)' not in backend:
              if fallback_marker not in backend:
                  raise SystemExit('failed to find Backend constructor tail')
              backend = backend.replace(
                  fallback_marker,
                  fallback_marker + '\t(void)RealtimeFallbackService::instance(*this);\n',
                  1,
              )
          backend_path.write_text(backend)

          doc_path = Path('docs/post-cache.md')
          doc = doc_path.read_text()
          marker = '## Timeline authority and reconnect validation'
          if marker not in doc:
              doc += r'''

          ## Timeline authority and reconnect validation

          Persistent caching must not make Mattermost's approximate message counts an
          authority for post identity. `total_msg_count_root` is useful for scrollbar
          scale and for choosing an initial random-seek page, but deleted roots and
          concurrent server changes can make the count disagree with the rows returned
          by `/channels/{id}/posts`.

          The channel source therefore uses this provenance order:

          1. an identity cursor (`before=<post_id>` / `after=<post_id>`) proves adjacency;
          2. overlap with an already authoritative identity proves global placement;
          3. an actual oldest/newest boundary can reconcile stale logical slots;
          4. an absolute page number is only a provisional seed for random seek.

          Ordinary scrolling must extend a known window with identity cursors. It must
          not repeatedly overwrite authoritative identities from page-number arithmetic.
          Every successful range request ends in one of three states: new identities
          were placed, a real boundary removed stale logical slots, or the request made
          no progress and is finished without an immediate retry loop.

          WebSocket reconnect uses the same bounded-working-set rule. A successful
          Mattermost sequence resume requires no HTTP history replay. If reliable replay
          explicitly fails, only the currently viewed conversation is validated
          immediately; inactive joined channels are left lazy and are validated when
          opened. This prevents a reconnect from filling either the network queue or the
          post cache with channels the user is not reading.

          Cache admission follows user interest rather than membership. By default a
          channel is eligible for resident-memory post caching for one hour after it was
          viewed, and for persistent SQLite post caching for ten hours after it was
          viewed. The current channel is always considered interested. These intervals,
          memory/disk limits, maintenance cadence, TTLs and vacuum controls are exposed
          on the cache settings page and are policy inputs rather than timeline geometry.
          '''
          doc_path.write_text(doc)
          PY

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          rm .github/workflows/chatgpt-apply-cache-fix.yml
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add sources/chat-area/ChannelPostSource.cpp \
                  sources/backend/Backend.cpp \
                  docs/post-cache.md \
                  .github/workflows/chatgpt-apply-cache-fix.yml
          git commit -m "Make channel history cursor-authoritative"
          git push origin HEAD:chatgpt/post-disk-cache
