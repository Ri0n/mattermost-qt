void PostWidget::animateNavigationHighlight()
{
    if (!navigationHighlightAnimation) {
        navigationHighlightAnimation = new QVariantAnimation(this);
        navigationHighlightAnimation->setDuration(1100);
        navigationHighlightAnimation->setKeyValueAt(0.0, 0.30);
        navigationHighlightAnimation->setKeyValueAt(0.35, 0.14);
        navigationHighlightAnimation->setKeyValueAt(0.52, 0.24);
        navigationHighlightAnimation->setKeyValueAt(1.0, 0.0);
        connect(navigationHighlightAnimation, &QVariantAnimation::valueChanged,
                this, [this](const QVariant& value) {
            navigationHighlightOpacity = value.toReal();
            update();
        });
        connect(navigationHighlightAnimation, &QVariantAnimation::finished,
                this, [this] {
            navigationHighlightOpacity = 0.0;
            update();
        });
    }

    navigationHighlightAnimation->stop();
    navigationHighlightAnimation->start();
}

void PostWidget::paintEvent(QPaintEvent* event)
{
    QWidget::paintEvent(event);
    if (navigationHighlightOpacity <= 0.0) {
        return;
    }

    QColor color = palette().color(QPalette::Highlight);
    color.setAlphaF(std::clamp(navigationHighlightOpacity, 0.0, 1.0));
    QPainter painter(this);
    painter.fillRect(rect(), color);
}

void PostWidget::changeEvent(QEvent* event)
'''
