name: Fix jump centering

on:
  push:
    branches:
      - chatgpt/saved-search-collections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
      - name: Apply navigation centering and highlight fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              p.write_text(text.replace(old, new, 1))

          # LongListWidget exposes a post-measurement hook. ChatLog uses it only
          # to finalize semantic navigation after a target row changed geometry.
          replace_once(
              'sources/widgets/LongListWidget.h',
              '    void materializedRangeChanged(int first, int last);\n\n    /** Emitted only for direct user scrollbar/wheel movement. */',
              '    void materializedRangeChanged(int first, int last);\n'
              '    /** Emitted after dirty materialized row heights have been remeasured. */\n'
              '    void geometryCommitted();\n\n'
              '    /** Emitted only for direct user scrollbar/wheel movement. */',
              'LongListWidget signal')

          replace_once(
              'sources/widgets/LongListWidget.cpp',
              '    scheduleSync(seekActive ? RequestReason::Seek : RequestReason::Scroll);\n'
              '    emitRangeChanges();\n}\n\n'
              'void LongListWidget::requestMissing',
              '    scheduleSync(seekActive ? RequestReason::Seek : RequestReason::Scroll);\n'
              '    emitRangeChanges();\n'
              '    emit geometryCommitted();\n}\n\n'
              'void LongListWidget::requestMissing',
              'LongListWidget commit hook')

          # Semantic navigation state stays independent from the raw viewport lock
          # until the target widget has a measured height.
          replace_once(
              'sources/chat-area/ChatLogWidget.h',
              '    void reconnectSource();\n'
              '    void rematerializeRange(int first, int last);\n'
              '    bool restoreNavigationTarget();\n',
              '    void reconnectSource();\n'
              '    void rematerializeRange(int first, int last);\n'
              '    bool restoreNavigationTarget();\n'
              '    bool finalizeNavigationLock();\n'
              '    void scheduleNavigationFinalize();\n',
              'ChatLog private methods')

          replace_once(
              'sources/chat-area/ChatLogWidget.h',
              '    QString navigationPostId;\n'
              '    int navigationLogicalIndex = -1;\n',
              '    QString navigationPostId;\n'
              '    int navigationLogicalIndex = -1;\n'
              '    Alignment navigationAlignment = Alignment::Center;\n'
              '    int navigationQuietPeriodMs = 2000;\n'
              '    bool navigationLockPending = false;\n'
              '    bool navigationRecenterPending = false;\n',
              'ChatLog navigation state')

          path = Path('sources/chat-area/ChatLogWidget.cpp')
          text = path.read_text()

          old = '''    connect(this, &LongListWidget::materializedRangeChanged, this,
            [this](int first, int last) {
        qCDebug(lcTimelineTrace).nospace()
            << "MATERIALIZED_RANGE list=" << static_cast<const void*>(this)
            << " source=" << sourceName(postSource)
            << " range=[" << first << ',' << last << ']'
            << " count=" << materializedCount();
    });
'''
          new = '''    connect(this, &LongListWidget::materializedRangeChanged, this,
            [this](int first, int last) {
        qCDebug(lcTimelineTrace).nospace()
            << "MATERIALIZED_RANGE list=" << static_cast<const void*>(this)
            << " source=" << sourceName(postSource)
            << " range=[" << first << ',' << last << ']'
            << " count=" << materializedCount();
        scheduleNavigationFinalize();
    });

    connect(this, &LongListWidget::geometryCommitted, this,
            [this] { scheduleNavigationFinalize(); });

    // A user gesture always wins over a still-pending semantic jump. Before a
    // viewport lock exists LongListWidget has nothing to release, so cancel the
    // pending semantic state here as well.
    connect(this, &LongListWidget::userViewportChanged, this, [this](bool) {
        if (!navigationLockPending) {
            return;
        }
        navigationPostId.clear();
        navigationLogicalIndex = -1;
        navigationLockPending = false;
        navigationRecenterPending = false;
    });
'''
