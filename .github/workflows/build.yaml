name: CI

on:
  push:
    branches:
      - master
      - feature/sidebar-categories-mute
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-qsourcehighlite:
    name: Vendor QSourceHighlite
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/sidebar-categories-mute'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/sidebar-categories-mute
          fetch-depth: 0

      - name: Import pinned upstream sources
        run: |
          if test -f third_party/QSourceHighlite/UPSTREAM_COMMIT; then
            exit 0
          fi
          upstream_commit=d78f0d4171580a18646b15425c449db3f2bb240a
          git clone --filter=blob:none https://github.com/Waqar144/QSourceHighlite.git /tmp/QSourceHighlite
          git -C /tmp/QSourceHighlite checkout "$upstream_commit"
          mkdir -p third_party/QSourceHighlite
          cp /tmp/QSourceHighlite/{LICENSE,languagedata.cpp,languagedata.h,qsourcehighliter.cpp,qsourcehighliter.h,qsourcehighliterthemes.cpp,qsourcehighliterthemes.h} third_party/QSourceHighlite/
          printf '%s\n' "$upstream_commit" > third_party/QSourceHighlite/UPSTREAM_COMMIT
          git add third_party/QSourceHighlite
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Vendor QSourceHighlite'
          git push origin HEAD:feature/sidebar-categories-mute

  qt6:
    name: Qt 6.10 / Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          modules: 'qtwebsockets'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=ON
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  qt5-ubuntu:
    name: Qt 5 / Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev libqt5websockets5-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=OFF
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  qt5-fedora:
    name: Qt 5 / Fedora
    runs-on: ubuntu-latest

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mattermost-qt

      - name: Build and test in Fedora
        run: |
          cat > Containerfile <<'EOF'
          FROM fedora:latest
          RUN dnf -y update \
              && dnf -y install cmake gcc-c++ make qt5-qtbase-devel qt5-qtwebsockets-devel \
              && dnf clean all
          COPY mattermost-qt /mattermost-qt
          WORKDIR /mattermost-qt
          RUN cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_6=OFF \
              -DBUILD_TESTING=ON \
              -DWARNINGS_AS_ERRORS=ON
          RUN cmake --build build --parallel 4
          RUN ctest --test-dir build --output-on-failure
          EOF
          podman build --tag mattermost-qt-fedora -f Containerfile

  qt6-windows:
    name: Qt 6.10 / Windows
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          modules: 'qtwebsockets'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=ON
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package portable ZIP
        shell: pwsh
        run: |
          cmake --install build --prefix package
          windeployqt --release --no-translations --compiler-runtime package/bin/mattermost-qt.exe
          Compress-Archive -Path package/* -DestinationPath mattermost-qt-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-qt-windows-x64
          path: mattermost-qt-windows-x64.zip
          if-no-files-found: error

  ubuntu-2604-package:
    name: Ubuntu 26.04 package
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            qt6-base-dev \
            qt6-websockets-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DQT_6=ON
          -DBUILD_TESTING=ON
          -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build DEB
        run: cpack --config build/CPackConfig.cmake -G DEB -B package

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-qt-ubuntu-26.04-amd64
          path: package/*.deb
          if-no-files-found: error
