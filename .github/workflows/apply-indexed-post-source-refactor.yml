name: Apply indexed post source refactor

on:
  push:
    paths:
      - '.github/workflows/apply-indexed-post-source-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply refactor
        run: python3 .github/scripts/apply-indexed-post-source-refactor.py
      - name: Remove temporary helper
        run: rm .github/scripts/apply-indexed-post-source-refactor.py .github/workflows/apply-indexed-post-source-refactor.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Share indexed post source bookkeeping'
          git push origin HEAD:chatgpt/post-disk-cache
