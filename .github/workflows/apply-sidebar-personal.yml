name: Apply Personal sidebar patch

on:
  push:
    branches:
      - chatgpt/sidebar-personal
    paths:
      - .github/apply_sidebar_personal.py
      - .github/workflows/apply-sidebar-personal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sidebar-personal
          fetch-depth: 0
      - name: Fix helper matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/apply_sidebar_personal.py')
          s = p.read_text()
          s = s.replace(
              r'void Backend::createDirectChannel \(const BackendUser& user\)\n\{.*?\n\}\n\nvoid Backend::retrieveChannelPosts',
              r'void Backend::createDirectChannel \(const BackendUser& user\)\n\{.*?\n\}\n\nvoid Backend::addUserToChannel')
          s = s.replace(
              'void Backend::retrieveChannelPosts"""',
              'void Backend::addUserToChannel"""')
          p.write_text(s)
          PY
      - name: Apply patch
        run: python3 .github/apply_sidebar_personal.py
      - name: Remove temporary helper
        run: rm .github/apply_sidebar_personal.py .github/workflows/apply-sidebar-personal.yml
      - name: Commit
        run: |
          git config user.name "Sergei Ilinykh"
          git config user.email "rion4ik@gmail.com"
          git add -A
          git commit -m "Add Personal virtual sidebar destination"
          git push origin HEAD:chatgpt/sidebar-personal
