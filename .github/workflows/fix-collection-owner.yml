name: Fix collection lambda ownership

on:
  push:
    branches:
      - chatgpt/saved-search-collections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sources/post-collection/PostCollectionView.cpp')
          text = path.read_text()
          replacements = [
              ('explicit CollectionList(PostCollectionView& owner, QWidget* parent)',
               'explicit CollectionList(PostCollectionView& collectionOwner, QWidget* parent)'),
              (', owner(owner)', ', owner(collectionOwner)'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected anchor count for {old!r}: {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm .github/workflows/fix-collection-owner.yml
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Fix collection lambda ownership'
          git push origin HEAD:chatgpt/saved-search-collections
