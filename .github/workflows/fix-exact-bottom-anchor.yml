name: Fix exact bottom anchor

on:
  push:
    paths:
      - '.github/workflows/fix-exact-bottom-anchor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix-exact-bottom-anchor.py
      - name: Remove temporary files
        run: rm .github/scripts/fix-exact-bottom-anchor.py .github/workflows/fix-exact-bottom-anchor.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Preserve exact thumb position near bottom'
          git push origin HEAD:chatgpt/post-disk-cache
