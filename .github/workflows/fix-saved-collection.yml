name: Fix Saved collection compile and paging

on:
  push:
    branches:
      - chatgpt/saved-search-collections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/saved-search-collections
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          channel = Path('sources/channel-tree/ChannelTree.cpp')
          text = channel.read_text()
          anchor = '''#endif
          }

          } // namespace
          '''
          replacement = '''#endif
          }

          class VirtualDestinationItem final : public ChannelItem
          {
          public:
              using ChannelItem::ChannelItem;

              void showContextMenu(const QPoint&) override {}
          };

          } // namespace
          '''
          if anchor not in text:
              raise SystemExit('ChannelTree namespace anchor not found')
          text = text.replace(anchor, replacement, 1)
          old = '    auto* item = new ChannelItem(backend, nullptr);\n'
          new = '    auto* item = new VirtualDestinationItem(backend, nullptr);\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected ChannelItem construction count: {text.count(old)}')
          channel.write_text(text.replace(old, new, 1))

          collection = Path('sources/post-collection/PostCollectionView.cpp')
          text = collection.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)if \(!result\.success\) \{\n'
              r'(?P=indent)    guard->hasMore = false;\n'
              r'(?P=indent)    guard->finishPendingRangeRequests\(\);\n'
              r'(?P=indent)    guard->updateStatus\(\);\n'
              r'(?P=indent)    return;\n'
              r'(?P=indent)\}',
              re.MULTILINE)
          match = pattern.search(text)
          if not match:
              raise SystemExit('PostCollectionView failure block not found')
          indent = match.group('indent')
          replacement = (
              f'{indent}if (!result.success) {{\n'
              f'{indent}    guard->hasMore = false;\n'
              f'{indent}    if (guard->list) {{\n'
              f'{indent}        guard->list->setItemCount(static_cast<int>(guard->posts.size()));\n'
              f'{indent}    }}\n'
              f'{indent}    guard->finishPendingRangeRequests();\n'
              f'{indent}    guard->updateStatus();\n'
              f'{indent}    return;\n'
              f'{indent}}}')
          collection.write_text(text[:match.start()] + replacement + text[match.end():])
          PY

          rm .github/workflows/fix-saved-collection.yml
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Fix Saved destination item and paging failure'
          git push origin HEAD:chatgpt/saved-search-collections
