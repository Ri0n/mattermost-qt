name: Format boundary probe code

on:
  push:
    branches:
      - chatgpt/post-disk-cache

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'Format boundary probe code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Format
        shell: bash
        run: |
          clang-format -i sources/chat-area/ChannelPostSource.cpp sources/chat-area/ChannelPostSource.h
          rm .github/workflows/format-boundary.yml
          git diff --check
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add sources/chat-area/ChannelPostSource.cpp sources/chat-area/ChannelPostSource.h
          git add -u .github
          git commit -m 'Format boundary probe changes'
          git push origin HEAD:chatgpt/post-disk-cache
