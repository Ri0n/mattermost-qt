name: Fix tail window root encoding

on:
  push:
    paths:
      - '.github/workflows/fix-tail-window-null-root.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/post-disk-cache
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix-tail-window-null-root.py
      - name: Remove temporary helper
        run: rm .github/scripts/fix-tail-window-null-root.py .github/workflows/fix-tail-window-null-root.yml
      - name: Commit result
        run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add -A
          git commit -m 'Normalize channel tail root cache key'
          git push origin HEAD:chatgpt/post-disk-cache
